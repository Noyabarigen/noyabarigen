জ সহজ করে দিন।”","সূরা ত্বা-হা ২০:২৫-২৬"],["“আজানের পর এই দোয়া পড়লে কিয়ামতে আমার সুপারিশ তার জন্য নিশ্চিত: ‘আল্লাহুম্মা রব্বা হাযিহিদ দাওয়াতিত তাম্মাহ…’।”","সহিহ বুখারি ৬১৪"],["“যে আল্লাহর সন্তুষ্টির জন্য মসজিদ নির্মাণ করে, আল্লাহ জান্নাতে তার জন্য অনুরূপ ঘর নির্মাণ করেন।”","সহিহ বুখারি ৪৫০ · সহিহ মুসলিম ৫৩৩"],["“হে আমার রব, আমার জ্ঞান বাড়িয়ে দিন।”","সূরা ত্বা-হা ২০:১১৪"],["“সূর্য উদিত হয় এমন দিনগুলোর মধ্যে জুমার দিনই সর্বোত্তম।”","সহিহ মুসলিম ৮৫৪"],["“যে তার রবকে স্মরণ করে আর যে করে না— তাদের উদাহরণ জীবিত ও মৃতের মতো।”","সহিহ বুখারি ৬৪০৭"],["“নিশ্চয়ই সালাত অশ্লীল ও মন্দ কাজ থেকে বিরত রাখে।”","সূরা আল-আনকাবূত ২৯:৪৫"],["“তোমাদের মধ্যে সর্বোত্তম সে, যে তার পরিবারের কাছে সর্বোত্তম; আর আমি আমার পরিবারের কাছে তোমাদের মধ্যে সর্বোত্তম।”","জামে তিরমিযি ৩৮৯৫ (সহিহ)"],["“ক্ষুধার্তকে খাওয়াও, অসুস্থকে দেখতে যাও এবং বন্দিকে মুক্ত করো।”","সহিহ বুখারি ৩০৪৬"],["“হে মুমিনগণ, আল্লাহকে ভয় করো এবং সঠিক কথা বলো।”","সূরা আল-আহযাব ৩৩:৭০"],["“কোনো মুসলিম গাছ লাগালে বা ফসল ফলালে তা থেকে পাখি, মানুষ বা পশু খেলে তা তার জন্য সদকা হয়ে যায়।”","সহিহ বুখারি ২৩২০ · সহিহ মুসলিম ১৫৫৩"],["“বিপদে যে বলে ‘ইন্না লিল্লাহি ওয়া ইন্না ইলাইহি রাজিউন, আল্লাহুম্মা আজিরনী ফী মুসীবাতী ওয়াখলুফ লী খাইরাম মিনহা’, আল্লাহ তাকে প্রতিদান ও উত্তম বিকল্প দেন।”","সহিহ মুসলিম ৯১৮"],["“তোমাদের রব বলেন, আমাকে ডাকো, আমি তোমাদের ডাকে সাড়া দেব।”","সূরা গাফির ৪০:৬০"],["“নবী ﷺ ঘুমানোর সময় বলতেন: ‘বিসমিকা আল্লাহুম্মা আমূতু ওয়া আহইয়া’।”","সহিহ বুখারি ৬৩২৪"],["“ঘুম থেকে উঠে বলতেন: ‘আলহামদুলিল্লাহিল্লাযী আহইয়ানা বা‘দা মা আমাতানা ওয়া ইলাইহিন নুশূর’।”","সহিহ বুখারি ৬৩১২"],["“ভালো ও মন্দ সমান নয়; উত্তম দিয়ে মন্দ প্রতিহত করো।”","সূরা ফুসসিলাত ৪১:৩৪"],["“বিসমিল্লাহ বলো, ডান হাতে খাও এবং নিজের সামনের দিক থেকে খাও।”","সহিহ বুখারি ৫৩৭৬ · সহিহ মুসলিম ২০২২"],["“নবী ﷺ কখনো কোনো খাবারের দোষ ধরতেন না; পছন্দ হলে খেতেন, না হলে রেখে দিতেন।”","সহিহ বুখারি ৩৫৬৩ · সহিহ মুসলিম ২০৬৪"],["“আমি জিন ও মানুষকে কেবল আমার ইবাদতের জন্যই সৃষ্টি করেছি।”","সূরা আয-যারিয়াত ৫১:৫৬"],["“মুসলিম ভাইয়ের অনুপস্থিতিতে তার জন্য দোয়া করলে ফেরেশতা বলেন, ী; তিনি কাউকে জন্ম দেননি, কেউ তাঁকে জন্ম দেয়নি; এবং তাঁর সমকক্ষ কেউ নেই।”","সূরা আল-ইখলাস ১১২:১-৪"],["“মসজিদে প্রবেশ করে দুই রাকাত সালাত না পড়ে কেউ যেন না বসে।”","সহিহ বুখারি ৪৪৪ · সহিহ মুসলিম ৭১৪"],["“যে ঘরে ওজু করে ফরজ সালাতের জন্য মসজিদে যায়, তার এক পদক্ষেপে গুনাহ মোচন হয় এবং অন্য পদক্ষেপে মর্যাদা বাড়ে।”","সহিহ মুসলিম ৬৬৬"],["“তোমরা ধৈর্য ও সালাতের মাধ্যমে সাহায্য প্রার্থনা করো; বিনয়ী ছাড়া অন্যদের জন্য তা অবশ্যই কঠিন।”","সূরা আল-বাকারা ২:৪৫"],["“মুনাফিকদের জন্য ফজর ও ইশার সালাতের চেয়ে ভারী সালাত নেই; তারা এর সওয়াব জানলে হামাগুড়ি দিয়ে হলেও আসত।”","সহিহ বুখারি ৬৫৭ · সহিহ মুসলিম ৬৫১"],["“যে ইশার সালাত জামাতে পড়ল, সে যেন অর্ধেক রাত কিয়াম করল; আর যে ফজরও জামাতে পড়ল, সে যেন পুরো রাত কিয়াম করল।”","সহিহ মুসলিম ৬৫৬"],["“তোমরা মানুষের সাথে উত্তম কথা বলো, সালাত কায়েম করো ও যাকাত দাও।”","সূরা আল-বাকারা ২:৮৩"],["“যে ভালোভাবে ওজু করে বলে ‘আশহাদু আন লা ইলাহা ইল্লাল্লাহু ওয়াহদাহু লা শারীকা লাহু ওয়া আশহাদু আন্না মুহাম্মাদান আবদুহু ওয়া রাসূলুহু’, তার জন্য জান্নাতের আটটি দরজাই খুলে দেওয়া হয়।”","সহিহ মুসলিম ২৩৪"],["“তোমরা সালাতসমূহের প্রতি যত্নবান হও এবং আল্লাহর সামনে বিনীত হয়ে দাঁড়াও।”","সূরা আল-বাকারা ২:২৩৮"],["“রমযানে উমরা করা হজের সমান সওয়াব।”","সহিহ বুখারি ১৭৮২ · সহিহ মুসলিম ১২৫৬"],["“মানুষ পেটের চেয়ে মন্দ কোনো পাত্র ভরে না; আদম সন্তানের জন্য কয়েক লোকমাই যথেষ্ট যা তার মেরুদণ্ড সোজা রাখে।”","জামে তিরমিযি ২৩৮০ (হাসান সহিহ)"],["“তোমাদের মধ্যে এমন একটি দল থাকা উচিত, যারা কল্যাণের দিকে ডাকবে, সৎকাজের আদেশ দেবে ও অসৎ কাজে নিষেধ করবে।”","সূরা আলে ইমরান ৩:১০৪"],["“মুমিন একটি আঁতে (পরিমিত) খায়, আর কাফির সাত আঁতে খায়।”","সহিহ বুখারি ৫৩৯৩ · সহিহ মুসলিম ২০৬০"],["“তোমরা তোমাদের রবের ক্ষমা ও জান্নাতের দিকে দ্রুত ধাবিত হও।”","সূরা আলে ইমরান ৩:১৩৩"],["“আল্লাহ সেই বান্দার প্রতি সন্তুষ্ট হন, যে খাবার খেয়ে বা পান করে ‘আলহামদুলিল্লাহ’ বলে।”","সহিহ মুসলিম ২৭৩৪"],["“শৌচাগারে প্রবেশের সময় নবী ﷺ বলতেন: ‘বিসমিল্লাহি আল্লাহুম্মা ইন্নী আউযু বিকা মিনাল খুবুসি ওয়াল খাবাইস’।”","সহিহ বুখারি ১৪২ · সহিহ মুসলিম ৩৭৫"],["“হে আমাদের রব, আমরা ঈমান এনেছি; আমাদের গুনাহ ক্ষমা করুন এবং আগ
